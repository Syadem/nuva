---
name: LV-SMENP-DC vaccine
description: Vaccin anti-covid 19 à vecteur viral non replicatif avec cellules présentant l'antigène. Cellules dendritiques modifiées par un lentivirus exprimant un minigène synthétique basé sur des extraits de protéines virales du SARS-CoV-2. Ce vaccin est aussi administré avec des lymphocytes T recombinants spécifiques aux antigènes du SARS-CoV-2
