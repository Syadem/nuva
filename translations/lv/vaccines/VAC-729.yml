name: LV-SMENP-DC vaccine
description: COVID-19 vakcīna, neatjaunojošs vīrusa vektors, ar antigēnu prezentējošām šūnām. Lenvīrusu modificētas dendrītšūnas, kas ekspresē sintētisku minigēnu, kura pamatā ir SARS-CoV-2 vīrusa proteīna ekstrakti. Šo vakcīnu ievada arī ar rekombinantām T šūnām, kas specifiskas SARS-CoV-2 antigēniem.
