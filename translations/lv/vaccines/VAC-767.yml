---
name: ChAdV68 SAM-LNP rS-TCE GRITSTONE ONCOLOGY COVID-19 VACCINE
description: Šimpanzes adenovīrusa un pašatjaunojošās mRNS pirmreizējā pavairošanas profilaktiskās COVID-19 vakcīnas:"1. neatjaunojošs šimpanzes adenovīrusa vektors, 68. serotips (ChAdV68), kas kodē SARS-CoV-2 smailes proteīnu (ChAdV68-S) un/vai smailes proteīnu un papildu SARS-CoV-2 T šūnu epitopus (ChAdV68-S-TCE), un 2. pašatjaunojoša mRNS (SAM) lipīdu nanodaļiņās (SAM-LNP), kas kodē SARS-CoV-2 smailes proteīnu (SAM-S) un/vai smailes proteīnu un papildu SARS-CoV-2 T šūnu epitopus (SAM-S-TCE), SAM vektors, kura pamatā ir Venecuēlas zirgu encefalīta vīruss (VEEV).
