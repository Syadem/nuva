name: LV-SMENP-DC vaccine
description: Szczepionka COVID-19, niereplikujący się wektor wirusowy, z komórkami prezentującymi antygen. Komórki dendrytyczne modyfikowane lentiwirusem, wyrażające syntetyczny minigen oparty na ekstraktach białek wirusa SARS-CoV-2. Szczepionka ta jest również podawana z rekombinowanymi komórkami T specyficznymi dla antygenów SARS-CoV-2
