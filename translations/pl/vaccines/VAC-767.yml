name: ChAdV68 SAM-LNP rS-TCE GRITSTONE ONCOLOGY COVID-19 VACCINE
description: Szczepionki przeciwko adenowirusowi szympansa i samowzmacniającemu się mRNA Prime-Boost profilaktyczne COVID-19:"1. Niereplikujący się wektor adenowirusowy szympansa, serotyp 68 (ChAdV68), kodujący białko kolca SARS-CoV-2 (ChAdV68-S) i/lub białko kolca plus dodatkowe epitopy komórek T SARS-CoV-2 (ChAdV68-S-TCE) oraz 2. Samoprzetwarzające się mRNA (SAM) w nanocząstkach lipidowych (SAM-LNP) kodujące białko kolca SARS-CoV-2 (SAM-S) lub białko kolca plus dodatkowe epitopy komórek T SARS-CoV-2 (SAM-S-TCE), wektor SAM oparty na wirusie zapalenia mózgu Wenezuelskich Koni (VEEV).
