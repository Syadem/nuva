---
name: Αδρανοποιημένο εμβόλιο της λύσσας με ολόκληρο τον ιό, εμβόλιο από καθαρισμένα κύτταρα εμβρύου νεοσσού (PCECV), το οποίο λαμβάνεται με την καλλιέργεια του σταθερού στελέχους του ιού της λύσσας Flury LEP-25 σε πρωτογενείς καλλιέργειες ινοβλαστών νεοσσού, ο ιός αδρανοποιείται με β-προπιολάκτον.
