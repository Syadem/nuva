name: HEXYON
description: Τοξοειδές διφθερίτιδας (τυπική δόση), τοξοειδές τετάνου, πολυσύνθετο οξυτενή κοκκύτη (2 συστατικά, τυπική δόση), Haemophilus influenzae τύπου β (συζευγμένο με τοξοειδές τετάνου), αδρανοποιημένο εμβόλιο πολιομυελίτιδας (τρισθενές) και ηπατίτιδας Β (ανασυνδυασμένο) παιδιατρικό εμβόλιο, προσροφημένο
