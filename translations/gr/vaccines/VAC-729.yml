name: LV-SMENP-DC vaccine
description: Εμβόλιο COVID-19, μη αναπαραγόμενος ιικός φορέας, με αντιγονοπαρουσιαστικά κύτταρα. Τροποποιημένα με lentivirus δενδριτικά κύτταρα που εκφράζουν ένα συνθετικό μίνι-γονίδιο με βάση εκχυλίσματα ιικών πρωτεϊνών SARS-CoV-2. Το εμβόλιο αυτό χορηγείται επίσης με ανασυνδυασμένα Τ κύτταρα ειδικά για τα αντιγόνα SARS-CoV-2
