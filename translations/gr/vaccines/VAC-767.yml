---
name: ChAdV68 SAM-LNP rS-TCE GRITSTONE ONCOLOGY COVID-19 VACCINE
description: Εμβόλια για τον αδενοϊό του χιμπατζή και το αυτοαποτυπούμενο mRNA Prime-Boost Προφυλακτικά εμβόλια COVID-19:"1. Μη αναπαραγόμενος φορέας αδενοϊού χιμπατζή, ορότυπος 68 (ChAdV68), που κωδικοποιεί την πρωτεΐνη αιχμής SARS-CoV-2 (ChAdV68-S) ή/και την πρωτεΐνη αιχμής συν πρόσθετους επίτοπους SARS-CoV-2 Τ-κυττάρων (ChAdV68-S-TCE), και 2. Αυτοενισχυόμενο mRNA (SAM) σε λιπιδικά νανοσωματίδια (SAM-LNP) που κωδικοποιεί την πρωτεΐνη αιχμής SARS-CoV-2 (SAM-S) ή/και την πρωτεΐνη αιχμής συν πρόσθετους επιτόπους SARS-CoV-2 Τ κυττάρων (SAM-S-TCE), φορέας SAM με βάση τον ιό της εγκεφαλίτιδας των ιπποειδών της Βενεζουέλας (VEEV).
