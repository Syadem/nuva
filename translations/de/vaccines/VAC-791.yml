---
name: Hexavalenter Diphtherie-Tetanus-Pertussis-Polio-Hib-Hepatitis B-Impfstoff, nicht spezifiziert
description: Kinderimpfstoff gegen Diphtherie (Toxoid, Standarddosis), Tetanus (Toxoid), Pertussis (ganz oder azellulär, Dosis nicht spezifiziert), Poliomyelitis (ganz, inaktiviert, trivalent), Anti-Haemophilus influenzae Typ b (konjugiert, nicht spezifiziert) und Hepatitis B (rekombinant).
