---
name: LV-SMENP-DC vaccine
description: COVID-19-Impfstoff, nicht-replizierender viraler Vektor, mit antigenpräsentierenden Zellen. Lentivirus-modifizierte dendritische Zellen, die ein synthetisches Minigen auf der Basis von SARS-CoV-2-Virusproteinextrakten exprimieren. Dieser Impfstoff wird auch mit rekombinanten T-Zellen verabreicht, die für SARS-CoV-2-Antigene spezifisch sind.
