name: ChAdV68 SAM-LNP rS-TCE GRITSTONE ONCOLOGY COVID-19 VACCINE
description: Schimpansen-Adenovirus und selbst-amplifizierende mRNA-Prime-Boost-Prophylaxeimpfstoffe COVID-19:1. Nicht-replizierender Schimpansen-Adenovirus-Vektor, Serotyp 68 (ChAdV68), der für das SARS-CoV-2-Spike-Protein (ChAdV68-S) und/oder das Spike-Protein plus zusätzliche SARS-CoV-2-T-Zellepitope (ChAdV68-S-TCE) kodiert, und 2. Selbstvervielfältigende mRNA (SAM) in Lipid-Nanopartikeln (SAM-LNP), die für das SARS-CoV-2-Spike-Protein (SAM-S) und/oder das Spike-Protein plus zusätzliche SARS-CoV-2-T-Zellepitope (SAM-S-TCE) kodiert, SAM-Vektor auf der Basis des Venezolanischen Pferdeenzephalitis-Virus (VEEV)
